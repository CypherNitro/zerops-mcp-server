zerops:
  - setup: docker
    run:
      base: docker@26.1
      prepareCommands:
        - apk add --no-cache python3 py3-pip openjdk17 android-tools
        - pip3 install --break-system-packages mcp starlette uvicorn httpx
        - wget -O /tmp/repo.tar.gz https://github.com/CypherNitro/zerops-mcp-server/archive/refs/heads/main.tar.gz
        - tar xzf /tmp/repo.tar.gz -C /tmp/
        - mkdir -p /app /workspace
        - cp /tmp/zerops-mcp-server-main/mcp_server.py /app/mcp_server.py
        - wget -q -O /usr/local/bin/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
        - wget -q -O /usr/local/bin/ew-cli https://maven.emulator.wtf/releases/ew-cli
        - chmod +x /usr/local/bin/ew-cli
      start: python3 /app/mcp_server.py
      ports:
        - port: 8080
          httpSupport: true
