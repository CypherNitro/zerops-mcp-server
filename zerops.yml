zerops:
  - setup: docker
    run:
      base: docker@26.1
      prepareCommands:
        - rm -rf /tmp/zerops-mcp-server-main /tmp/repo.tar.gz /tmp/setup.sh
        - wget -O /tmp/setup.sh https://raw.githubusercontent.com/CypherNitro/zerops-mcp-server/main/setup.sh
        - sh /tmp/setup.sh
      start: python3 /app/mcp_server.py
      ports:
        - port: 8080
          httpSupport: true
